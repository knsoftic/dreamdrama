name: Build Android APK

# Kaise chalayein:
#  - GitHub par repo kholein → Actions → "Build Android APK" → Run workflow (version likhein)
#  - Ya ek tag push karein: git tag app-v1.0.1 && git push origin app-v1.0.1
# APK "Releases" mein aa jayega aur landing page ka download button us par point karta hai.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 1.0.1)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.version }}"
          else
            NAME="${GITHUB_REF_NAME#app-v}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore (optional)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Keystore ready — release build signed with your key."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No keystore secret — building a debug-signed APK (installs fine)."
          fi

      - name: Add google-services.json (optional, for push notifications)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            echo "$GS" > android/app/google-services.json
            echo "Firebase config added — notifications enabled in the APK."
          else
            echo "No GOOGLE_SERVICES_JSON secret — APK builds without push (app still works)."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.sign.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PappVersionName=${{ steps.ver.outputs.name }} \
            -PappVersionCode=${{ steps.ver.outputs.code }} \
            ${{ vars.APP_URL && format('-PappUrl={0}', vars.APP_URL) || '' }}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dramaearn.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DramaEarn App ${{ steps.ver.outputs.name }}
          make_latest: true
          files: dramaearn.apk
          body: |
            DramaEarn Android app ${{ steps.ver.outputs.name }}.
            Download **dramaearn.apk** below. Install guide: /download page on the site.
